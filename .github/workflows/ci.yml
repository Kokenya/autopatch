name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install (from source, exactly like a user)
        run: pip install -e ".[dev]"
      - name: Test suite (offline; no API credits)
        run: python -m pytest tests/ -q
      - name: Benchmark, offline tier
        run: python benchmarks/run.py
