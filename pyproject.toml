[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "autopatch"
version = "0.2.0"
description = "Autonomous vulnerability remediation agent: scanner alerts -> sandbox-verified Pull Requests"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = []
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
]

[project.optional-dependencies]
dev = ["pytest"]
scan = ["semgrep"]

[project.scripts]
autopatch = "autopatch.cli:main"

[tool.setuptools]
packages = ["autopatch"]
